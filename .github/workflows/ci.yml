name: Validate lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: ./scripts/setup-python.sh
      - run: .venv/bin/ruff check agentlab containers scripts tests
      - run: shellcheck scripts/*.sh
      - run: .venv/bin/pytest -q tests/unit tests/fault
      - run: .venv/bin/python -m build --wheel --no-isolation
      - run: python3 scripts/check-public.py

  ubuntu-bootstrap-and-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the actual Ubuntu host setup
        run: sudo bash scripts/bootstrap-ubuntu.sh --install-only
      - name: Run real rootless sandbox validation
        run: sudo agentlab validate --profile sandbox
      - name: Confirm installer reruns cleanly
        run: |
          sudo mkdir -p /opt/generic-agent-lab/source/build
          sudo touch /opt/generic-agent-lab/source/build/stale-module.txt
          sudo bash scripts/bootstrap-ubuntu.sh --install-only
          test ! -e /opt/generic-agent-lab/source/build/stale-module.txt
      - name: Show report
        if: always()
        run: sudo agentlab report
      - name: Clean lab-owned resources
        if: always()
        run: sudo agentlab cleanup
