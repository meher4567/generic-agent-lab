name: Validate lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: ./scripts/setup-python.sh
      - run: .venv/bin/ruff check agentlab containers scripts tests
      - run: shellcheck scripts/*.sh
      - run: .venv/bin/pytest -q tests/unit tests/fault
      - run: .venv/bin/python -m build --wheel --no-isolation
      - run: python3 scripts/check-public.py

  ubuntu-bootstrap-and-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the actual Ubuntu host setup
        run: sudo bash scripts/bootstrap-ubuntu.sh --install-only
      - name: Run real rootless sandbox validation
        run: sudo env XDG_CONFIG_HOME=/root/operator-config XDG_DATA_HOME=/root/operator-data agentlab validate --profile sandbox
      - name: Run full three-VM validation when the host supports it
        run: |
          if sudo agentlab doctor --json; then
            sudo agentlab validate --profile full
          else
            echo 'Full VM acceptance unavailable on this runner; the sandbox result remains PARTIAL.'
          fi
      - name: Confirm installer reruns cleanly
        run: |
          sudo mkdir -p /opt/generic-agent-lab/source/build
          sudo touch /opt/generic-agent-lab/source/build/stale-module.txt
          sudo bash scripts/bootstrap-ubuntu.sh --install-only
          test ! -e /opt/generic-agent-lab/source/build/stale-module.txt
      - name: Show report
        if: always()
        run: sudo agentlab report --details
      - name: Verify diagnostic collection, including the standalone fallback
        if: always()
        run: |
          if command -v agentlab >/dev/null; then
            sudo agentlab diagnose
          fi
          sudo bash scripts/diagnose.sh --output-dir "$RUNNER_TEMP/lab-diagnostics"
      - name: Show rootless startup diagnostics on failure
        if: failure()
        run: |
          cd /opt/generic-agent-lab/source
          lab_uid=$(id -u agentlab)
          sudo runuser -u agentlab -- env \
            XDG_CONFIG_HOME=/home/agentlab/.config XDG_DATA_HOME=/home/agentlab/.local/share \
            XDG_CACHE_HOME=/home/agentlab/.cache \
            XDG_RUNTIME_DIR="/run/user/$lab_uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$lab_uid/bus" \
            podman --log-level=debug info
          sudo runuser -u agentlab -- env \
            XDG_CONFIG_HOME=/home/agentlab/.config XDG_DATA_HOME=/home/agentlab/.local/share \
            XDG_RUNTIME_DIR="/run/user/$lab_uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$lab_uid/bus" \
            podman run --rm docker.io/library/ubuntu:24.04 sh -c '
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace acl
              getfacl -p /etc/debian_version /etc /tmp
              cat /proc/self/uid_map /proc/self/gid_map
              strace -e trace=fchmod,fchmodat,fchmodat2,setxattr,lsetxattr,fsetxattr,getxattr,lgetxattr,fgetxattr cp -p /etc/debian_version /tmp/lab-copy
            '
      - name: Clean lab-owned resources
        if: always()
        run: sudo agentlab cleanup
